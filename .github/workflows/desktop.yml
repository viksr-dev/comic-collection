# Builds the Windows desktop app (desktop/) and offers it as a download.
# To get it: open the repository's Actions tab, click the latest
# "Desktop app" run, and download "ComicCatalog-windows" at the bottom.
# Each build on main is also published as a release ("desktop-<run number>"),
# which the app checks for and installs by itself.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the database code
        run: dotnet run --project desktop/tests/DataTests.vbproj

      - name: Build the app
        run: >
          dotnet publish desktop/ComicCatalog/ComicCatalog.vbproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          -p:Version=1.0.${{ github.run_number }}

      - name: Add the database scripts and sample database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/database | Out-Null
          Copy-Item desktop/database/* publish/database/
          Copy-Item desktop/README.md publish/README.md

      - name: Take a screenshot with the sample comics
        continue-on-error: true
        shell: pwsh
        run: |
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $dir = Join-Path $docs 'Comic Catalog'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item desktop/database/sample-comics.db (Join-Path $dir 'screenshot.db')
          $env:COMICCATALOG_NO_UPDATE = '1'
          @{ DatabasePath = (Join-Path $dir 'screenshot.db'); RelayUrl = '' } | ConvertTo-Json | Set-Content (Join-Path $dir 'settings.json')
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          function Snap($name, $appArgs) {
            $app = if ($appArgs) { Start-Process publish/ComicCatalog.exe -ArgumentList $appArgs -PassThru } else { Start-Process publish/ComicCatalog.exe -PassThru }
            Start-Sleep -Seconds 12
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screenshots/$name.png")
            # A small copy in the log, so the look can be checked without downloading.
            $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width * 0.75)), ([int]($b.Height * 0.75))
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
            $params = New-Object System.Drawing.Imaging.EncoderParameters 1
            $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 70L
            $ms = New-Object System.IO.MemoryStream
            $small.Save($ms, $codec, $params)
            $text = [Convert]::ToBase64String($ms.ToArray())
            Write-Output "SCREENSHOT-BEGIN $name"
            for ($i = 0; $i -lt $text.Length; $i += 2000) { Write-Output $text.Substring($i, [Math]::Min(2000, $text.Length - $i)) }
            Write-Output 'SCREENSHOT-END'
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 2
          }
          Snap 'main' $null
          Snap 'edit' '--screenshot-edit'

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ComicCatalog-windows
          path: publish/
          retention-days: 90

      - name: Publish the update for the app to find
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/* -DestinationPath ComicCatalog-windows.zip
          # A merged pull request's own title says what changed; "Merge pull request #…" doesn't.
          $subject = git log -1 --format=%s
          $notes = if ($subject -like 'Merge pull request*') { git log -1 --format=%b } else { git log -1 --format=%s%n%n%b }
          gh release create "desktop-${{ github.run_number }}" publish/ComicCatalog.exe ComicCatalog-windows.zip `
            --title "Comic Catalog build ${{ github.run_number }}" --notes "$($notes -join "`n")" --latest
